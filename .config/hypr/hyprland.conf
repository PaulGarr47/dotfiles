###################
### MY PROGRAMS ###
###################

# See https://wiki.hypr.land/Configuring/Keywords/

# Set programs that you use
$terminal = kitty
# $fileManager = dolphin
$menu = rofi -show drun

#################
### AUTOSTART ###
#################

# Autostart necessary processes (like notifications daemons, status bars, etc.)
# Or execute your favorite apps at launch like this:

exec-once = systemctl --user start hyprpolkitagent # starts hyprpolkitagent to anage system priveleges and authentication requests
exec-once = wl-paste --type text --watch cliphist store # stores only text data
exec-once = wl-paste --type image --watch cliphist store # stores only image
exec-once = udiskie # handles  automatic mounting of USB mass storage devices
exec-once = $terminal
exec-once = waybar
exec-once = hyprpaper
exec-once = hypridle
exec-once = hyprsunset
exec-once = hyprctl dispatch workspace 1
exec-once = systemctl --user start hyprpolkitagent

source = ~/.config/hypr/bind.conf

#############################
### ENVIRONMENT VARIABLES ###
#############################

